name: Recordatorios
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node enviar.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
